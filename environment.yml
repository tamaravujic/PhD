# ==============================================================================
# Conda Environment Configuration
#
# Create environment with:
#   conda env create -f environment.yml
#
# Activate environment with:
#   conda activate variant_analysis
#
# Update existing environment:
#   conda env update -f environment.yml --prune
# ==============================================================================

name: variant_analysis

channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # ==============================================================================
  # Core Programming Languages
  # ==============================================================================
  - python=3.11
  - r-base=4.3
  - perl=5.34

  # ==============================================================================
  # Bioinformatics Tools - Variant Calling & Annotation
  # ==============================================================================
  - bcftools=1.16          # VCF manipulation
  - bedtools=2.31          # Genomic interval operations
  - vcftools=0.1.16        # VCF analysis
  - tabix=1.18             # Index and query compressed files
  - bgzip                  # Compress files with block gzip

  # ==============================================================================
  # Bioinformatics Tools - Sequence Analysis
  # ==============================================================================
  - bwa=0.7.17             # Sequence alignment
  - samtools=1.16          # SAM/BAM file operations
  - bowtie2=2.5            # Short read alignment
  - freebayes=1.3          # Variant calling

  # ==============================================================================
  # Bioinformatics Tools - ATAC-seq Analysis
  # ==============================================================================
  - macs2=2.2              # Peak calling
  - fastqc=0.11            # Quality control
  - cutadapt=4.2           # Adapter trimming
  - preseq=3.1             # Library complexity estimation

  # ==============================================================================
  # R Packages - Data Analysis & Visualisation
  # ==============================================================================
  - r-tidyverse=1.3        # Data manipulation (dplyr, ggplot2, etc.)
  - r-ggplot2=3.4          # Advanced visualisation
  - r-ggrepel=0.9          # Repel overlapping text labels
  - r-patchwork=1.1        # Combine plots
  - r-heatmap.plus=1.3     # Enhanced heatmaps
  - r-venndiagram=1.7      # Venn diagrams

  # ==============================================================================
  # R Packages - Bioinformatics
  # ==============================================================================
  - r-bioconductor=3.16    # Bioinformatics repository
  - r-genomicranges=1.52   # Genomic coordinates
  - r-diffbind=3.10        # ATAC-seq analysis (DiffBind)
  - r-genomicalignments=1.36  # Alignment handling

  # ==============================================================================
  # R Packages - Statistics
  # ==============================================================================
  - r-car=3.1              # Companion to applied regression
  - r-gridExtra=2.3        # Grid graphics utilities
  - r-lme4=1.1             # Linear mixed-effects models

  # ==============================================================================
  # Jupyter & Notebooks
  # ==============================================================================
  - jupyter=1.0
  - jupyterlab=3.6
  - notebook=6.5
  - ipython=8.10

  # ==============================================================================
  # Python Scientific Stack
  # ==============================================================================
  - numpy=1.23
  - pandas=1.5
  - scipy=1.9
  - scikit-learn=1.1
  - matplotlib=3.6
  - seaborn=0.12

  # ==============================================================================
  # Deep Learning (for ChromBPNet)
  # ==============================================================================
  - tensorflow=2.11
  - keras=2.11

  # ==============================================================================
  # Utilities
  # ==============================================================================
  - curl                   # Download files
  - wget                   # Download files
  - parallel               # GNU parallel (job parallelisation)
  - jq                     # JSON parsing

# ==============================================================================
# Pip-only Dependencies
# ==============================================================================
# These packages are not available in conda and must be installed via pip
pip:
  - tqdm>=4.64.0           # Progress bars
  - pyyaml>=6.0            # Configuration files
  - biopython>=1.80        # Biological computation
  - pysam>=0.20.0          # Sequence alignment/variant file handling
  - requests>=2.28.0       # HTTP library

# ==============================================================================
# Notes
# ==============================================================================
#
# Platform-specific considerations:
#   - macOS: Some tools may require additional configuration
#   - Linux HPC: Singularity containers may be preferred for VEP
#
# Memory requirements:
#   - ChromBPNet: 60+ GB RAM
#   - Large VCF processing: 32+ GB RAM
#   - Standard analysis: 8-16 GB RAM
#
# Compatibility:
#   - Python 3.11 recommended for latest packages
#   - R 4.3+ for recent Bioconductor packages
#
# To use specific tool versions:
#   - Modify version numbers in this file
#   - Recreate environment: conda env remove -n variant_analysis
#   - Then: conda env create -f environment.yml
